name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    # T2: opened, edited, synchronize, reopened. #773 dropped synchronize
    # because a pipeline push pinned a FAILURE check run to the new head
    # before the PR step rewrote the body, and GitHub kept that failure
    # next to the later edited SUCCESS. Since the pre-push attestation
    # change (#994), synchronize is the event that judges a pipeline-pushed
    # head, so it is restored.
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md

permissions:
  contents: read
  # Lets require-no-mistakes read this PR's LIVE body/head SHA instead of the
  # workflow's own cached event payload, which a job rerun replays verbatim
  # from its original trigger. Without this the gate fails closed rather than
  # certifying from the possibly-stale event payload. See
  # .github/actions/require-no-mistakes/README.md.
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so the release pipeline keeps working:
    # - github-actions[bot] opens the release-please PR via GITHUB_TOKEN
    # - dependabot[bot] opens dependency update PRs
    # Other authors (human or bot) must raise PRs through `git push no-mistakes`.
    #
    # These stay job-level rather than moving to the action's `exempt-authors`
    # input on purpose: an in-job exemption still requires the run to start, and
    # a GITHUB_TOKEN PR's run is created in action_required and never starts. A
    # skipped job is also what every ruleset in the fleet already sees for these
    # authors, so keeping the condition here preserves the exact verdict shape.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      # Pinned to the immutable commit that published the action, never @main:
      # main is editable by the very pull request this gate is judging. A pull
      # request that changes the action is still TESTED here (the repository's
      # own Go tests execute verify.py from the PR head), but it cannot certify
      # itself through the required check.
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
        with:
          exempt-authors: kunchenguid
