name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test on Unix
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Test on Windows
        if: runner.os == 'Windows'
        run: go test -v -timeout=15m ./...

      - name: Build
        run: go build ./cmd/no-mistakes

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      # The flake pins a fixed-output vendorHash that every go.mod/go.sum
      # change invalidates. Without this job the Go suite stays green while
      # `nix run github:kunchenguid/no-mistakes` fails for every user with a
      # hash mismatch until a human notices.
      - name: Build flake
        run: nix build --print-build-logs

      # `nix build` only touches this runner's own system, so a system the
      # flake advertises but nixpkgs cannot evaluate would surface first as a
      # user's failed `nix run` on that platform.
      - name: Check flake on every advertised system
        run: nix flake check --all-systems

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The e2e suite drives the real no-mistakes binary against a fake
      # agent through `git push -> daemon -> pipeline -> push to upstream`
      # for claude, codex, and opencode. It builds the binary itself, so
      # no separate build step is needed. Linux-only for now: opencode's
      # ephemeral HTTP server picks up unused ports via :0, which is
      # fine on Linux runners but flakes on Windows agent harnesses.
      - name: End-to-end suite
        run: make e2e
